# Sensible energy properties.
# Main difference relative to standard Liu model. Uses Michelsen expression for rho*cp.
M: 0.01201
rho: 'lambda self, T: 1500'
cp: >- # specific heat capacity from Michelsen (2021)
  lambda self, T: 1e6 * (1 / self.rho(T)) * (1.7e-5 * T ** 2.07 / (1 + (T / 423.44) ** 2.07) + 0.12 * np.exp(-((T - 149) / 87.4) ** 2))

# Conduction model.
alpha: 0.3

# Gas properties.
mg: 4.8089207e-26 # for air
g0: 1.3815656356
g1: 2.096493948e-4
g2: -6.8122005756e-7
g3: 7.0406973672e-10
g4: -3.7056207245e-13
g5: 1.0685878651e-16
g6: -1.6066706534e-20
g7: 9.8549838293e-25
gamma1: 'lambda self, T: self.g0 + self.g1*T + self.g2*T**2 + self.g3*T**3 + self.g4*T**4 + self.g5*T**5 + self.g6*T**6 + self.g7*T**7' # from N2
gamma2: 'lambda self, T: (self.gamma1(T) + 1) / (self.gamma1(T) - 1)'
k0: 9.6974968295e-3
k1: 6.3285371033e-5
k2: -4.064380813e-9
k: 'lambda self, T: self.k0 + self.k1 * T + self.k2 * T ** 2'
f: 1.3 # Eucken factor (1.3 for diatomic; 2.5 for monatomic)

# Parameters for sublimation model.
c0: 17.179009
c1: 0.00068653967635
c2: 0.0000029961854512
c3: -8.5953909792e-10
c4: 1.048603913e-13
b0: 205397.9441
b1: 736.5976673633
b2: -0.4071259996
b3: 0.00011992011908
b4: -1.7945643843e-8
b5: 1.0716526849e-12
a0: -122.9647954064
a1: 0.0905578765
a2: -2.7637173028e-5
a3: 4.1753526681e-9
a4: -2.4874882191e-13

# Sublimation model.
alpham: 'lambda self, T: 0.2'
Mv: 'lambda self, T: (self.c0 + self.c1 * T + self.c2 * T ** 2 + self.c3 * T ** 3 + self.c4 * T ** 4) / 1000'
mv: 'lambda self, T: self.Mv(T) * 1.660538782e-24'
hv: >-
  lambda self, T: (self.b0 + (self.b1 * T) + (self.b2 * T ** 2) + (self.b3 * T ** 3) + (self.b4 * T ** 4) + (self.b5 * T ** 5)) / (self.mv(T) / 1.660538782e-24)
pv: >-
  lambda self, T, dp, hv: 101325 * np.exp(self.a0 + (self.a1 * T) + (self.a2 * T ** 2) + (self.a3 * T ** 3) + (self.a4 * T ** 4))

# Absorption properties.
CEmr: 1
Emr: 'lambda self, l1, l2, dp: self.CEmr'
Em: 'lambda self, l, dp, X: 0.4'
Eml: 'lambda self, dp, X: self.Em(self.l_laser, dp, X)'
