opts:
  rho: default
  cp: default
  hv: default
  abs: default
  Em: default
  M: default
  pv: default
  mv: default
  propmodel: default
alpham: 'lambda T: 0.1'
M: 0.01201
Arho: 1
Brho: 1
rho: 'lambda self T:  (self.Arho * 2.303-self.Brho * 7.3106e-5 * T) * 1000'
Ccp: 1
cp: >-
  lambda self T:  self.Ccp * (self.R/0.01201) * (1.115 * (597 / T) ** 2 * np.exp(597 / T) * (np.exp(597 / T)-1) ** -2+1.789 * (1739 / T) ** 2 * np.exp(1739 / T) * (np.exp(1739 / T)-1) ** -2+T / 8260)
alpha: 0.3
Mv: 0.03603
Rs: 230.76497640854845
mv: 5.982921231546e-26
hv: 'lambda self T:  (8.443e5-26.921 * T) / self.Mv'
Pref: 101325
Tb: 4136.78
hvb: 20.342318779350542
pv: '@(T,dp,hv,prop)self.Pref * np.exp(-self.hvb * 1e6 / self.Rs * (1 / T-1 / self.Tb))'
Em: '@(l,dp,X,prop) 0.34'
CEmr: 1
Emr: '@(l1,l2,dp,prop)self.CEmr'
Eml: '@(dp,X)self.Em(self.l_laser,dp,X)'
