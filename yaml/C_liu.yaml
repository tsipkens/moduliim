model: 'Liu'

# Sensible energy properties.
M: 0.01201
Tm: 1811
Arho: 1
Brho: -0.64985
rho: 'lambda self, T: self.Arho * 1900'
Ccp: 1
Dcp: 1
cp: >-
  lambda self, T: self.Ccp * 1000 * self.iif(T<1200, -9.7768e-4 + (2.7943e-4 * T) + (1.4554e-5 * T ** 2) - (3.4432e-8 * T ** 3) + (3.6700e-11 * T ** 4)-(1.9485e-14 * T ** 5) + (4.1802e-18 * T ** 6),
  2.9497e-1 + (2.9614e-3 * T)-(2.1232e-6 * T ** 2) + (8.1901e-10 * T ** 3)-(1.7516e-13 * T ** 4) + (1.9628e-17 * T ** 5)-(8.9817e-22 * T ** 6))

# Conduction model.
alpha: 0.37

# Parameters for sublimation model.
coeffs_Mv: [1.0486e-13, -8.5954e-10, 0.0000029962, 0.00068654, 17.179]
coeffs_Hv: [1.0717e-12, -1.7946e-8, 0.00011992, -0.40713, 736.6, 205398]
coeffs_pv: [-2.4875e-13, 4.1754e-9, -0.000027637, 0.090558, -122.96]

# Sublimation model.
alpham: 'lambda self, T: 0.77'
Mv: 'lambda self, T: polyval(self.coeffs_Mv, T) / 1000'
mv: 'lambda self, T: self.Mv(T) * 1.660538782e-24'
hv: >-
  lambda self, T: polyval(self.coeffs_Hv, T) / (self.mv(T) / 1.660538782e-24)
pv: >-
  lambda self, T, dp, hv: 101325 * exp(polyval(self.coeffs_pv, T))

# Absorption properties.
CEmr: 1
Emr: 'lambda self, l1, l2, dp: self.CEmr'
Em: 'lambda self, l, dp, X: 0.38'
Eml: 'lambda self, dp, X: self.Em(self.l_laser, dp, X)'
