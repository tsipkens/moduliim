# Properties largely for 'lignin' from Hallett and Clark (2006).
I: 220  # molecular weight, 220 chosen to produce (Tcr - Tb) ** 0.38 = 7.856 from Hallett

# Sensible energy properties.
M: 0.01201
rho: 'lambda self, T: 1800'
aL: 0.9239
bL: 0.004166
cL: 0
cp: 'lambda self, T: (self.aL + self.bL * T + self.cL * T ** 2) * self.I'

# Conduction properties.
alpha: 0.37

# Sublimation properties.s
vapor_species:
  - species: 'lignin'
    I: 220  # molecular weight, 220 chosen to produce (Tcr - Tb) ** 0.38 = 7.856 from Hallett
    aB: 346.9
    bB: 1.097
    Tb: 'lambda self: self.aB + self.bB * self.I'
    acr: 630
    bcr: 0.841
    Tcr: 'lambda self: self.acr + self.bcr * self.I'
    aP: 60
    bP: -0.128
    Pcr: 'lambda self: (self.aP + self.bP * self.I) * 101325'
    aD: 3.19e-9
    bD: -5.12e-12
    bphi: 245
    D: (self.aD + self.bD * self.I) * (T ** (5/2) / (self.bphi + T))
    aH: 3.35e7
    bH: 1.28e5
    PhiH: 'lambda self, T: ((self.Tcr() - T) / (self.Tcr() - self.Tb())) ** 0.38'
    hv: 'lambda self, T: self.PhiH(np.minimum(T, self.Tcr())) * (self.aH + self.bH * self.I) / self.I'
    Mv: 'lambda self, T: self.I / 1e3'
    mv: >-
      lambda self, T: self.Mv(T) * 1.660538782e-24
    hvb: 'lambda self: np.log(self.Pcr() / 101325) * R / (1 / self.Tb() - 1 / self.Tcr())'
    Ccc: 'lambda self: np.log(self.Pcr()) + self.hvb() / R / self.Tcr()'
    pv: 'lambda self, T, dp=None, hv=None, X=0.0: (1 - X) * exp(self.Ccc() - self.hvb() / R / T)'
  - species: 'C3'
    Tref: 4136.78
    Mv: 0.03603
    alpham: 'lambda self, T: 0.1'
    hv: 'lambda self, T: 8.443e5 - 26.921*T'
    pv: 'lambda self, T, dp, hv, X=0.: X * self.eq_claus_clap(T, dp, hv)'
    mv: 'lambda self, T: self.Mv * 1.660538782e-24'


# Absorption properties.
Em: 'lambda self, l, dp, X: 0.2' #0.2 * exp(5 * (X - 1))'
Eml: 'lambda self, dp, X: self.Em(self.l_laser, dp, X)'

# Annealing properties.
DH: [0,]
A: [1e15,]  #1e15
E: [80e3,]
Xd: 0.01
